name: Historia diaria de Instagram

# Publica una historia por dia habil, siempre entre las 8:30 y las 11:15 de la
# mañana (hora de Argentina).
#
# Por que esta armado asi: GitHub no ejecuta las tareas programadas a horario.
# El retraso varia muchisimo (en noviembre de 2026 paso de 1 hora a 10 horas),
# asi que fijar un unico horario de salida no sirve. En vez de eso hay muchos
# intentos repartidos y cada uno mira la hora REAL antes de hacer nada:
#   - fuera de la franja de la mañana  -> no publica
#   - fin de semana                    -> no publica
#   - ya se publico hoy                -> no publica
# Asi, sea cual sea el retraso, alguno de los intentos cae dentro de la franja
# y publica; los demas terminan en segundos sin tocar nada.
on:
  schedule:
    # Cada 30 minutos entre las 01:00 y las 14:30 UTC, de lunes a viernes.
    # Cubre retrasos de 0 a 10 horas respecto de la franja de la mañana.
    - cron: "0,30 1-14 * * 1-5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Probar sin publicar (true para simular)"
        required: false
        default: "false"

permissions:
  contents: write

# Las ejecuciones se encolan de a una, asi dos intentos simultaneos no pueden
# publicar la misma historia dos veces.
concurrency:
  group: historia-diaria
  cancel-in-progress: false

defaults:
  run:
    working-directory: auto-ig

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Corresponde publicar ahora?
        id: control
        run: |
          export TZ=America/Argentina/Buenos_Aires
          FECHA=$(date +%F)
          HORA=$(date +%H:%M)
          MINUTOS=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          DIA=$(date +%u)          # 1=lunes ... 7=domingo
          DESDE=510                # 8:30
          HASTA=675                # 11:15
          echo "FECHA=$FECHA" >> $GITHUB_ENV
          echo "Hora en Argentina: $FECHA $HORA"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "seguir=si" >> $GITHUB_OUTPUT
            echo "Ejecución manual: se publica sin mirar la hora."
          elif [ -f "publicado/$FECHA.txt" ]; then
            echo "seguir=no" >> $GITHUB_OUTPUT
            echo "La historia del $FECHA ya se publicó."
          elif [ "$DIA" -gt 5 ]; then
            echo "seguir=no" >> $GITHUB_OUTPUT
            echo "Es fin de semana."
          elif [ "$MINUTOS" -lt "$DESDE" ] || [ "$MINUTOS" -gt "$HASTA" ]; then
            echo "seguir=no" >> $GITHUB_OUTPUT
            echo "Fuera de la franja de la mañana (8:30 a 11:15). No se publica."
          else
            echo "seguir=si" >> $GITHUB_OUTPUT
            echo "Dentro de la franja: se publica."
          fi

      - uses: actions/setup-python@v5
        if: steps.control.outputs.seguir == 'si'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.control.outputs.seguir == 'si'
        run: |
          pip install --quiet pillow playwright requests
          playwright install --with-deps chromium

      - name: Generar la historia del día
        if: steps.control.outputs.seguir == 'si'
        run: python3 generar.py

      - name: Guardar la imagen en el repositorio
        if: steps.control.outputs.seguir == 'si'
        run: |
          ARCHIVO=$(cat ultima.txt)
          echo "ARCHIVO=auto-ig/$ARCHIVO" >> $GITHUB_ENV
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f "$ARCHIVO" estado.json
          git commit -m "Historia del $FECHA" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar la imagen, se continúa igual"

      - name: Publicar la historia en Instagram
        id: publicacion
        if: steps.control.outputs.seguir == 'si'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_ACCES_TOKEN }}
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${ARCHIVO}"
          echo "Imagen: $URL"
          RUTA="${ARCHIVO#auto-ig/}"
          if [ "${{ github.event.inputs.simular }}" = "true" ]; then
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL" --simular
          else
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL"
          fi

      - name: Dejar constancia de la publicación
        if: steps.publicacion.outcome == 'success' && github.event.inputs.simular != 'true'
        run: |
          mkdir -p publicado
          echo "Publicada el $FECHA" > "publicado/$FECHA.txt"
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f "publicado/$FECHA.txt" registro.log
          git commit -m "Publicada la historia del $FECHA" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar la constancia"

      - name: Guardar el registro cuando algo falla
        if: failure() || steps.publicacion.outcome == 'failure'
        run: |
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f registro.log || true
          git commit -m "Registro del $FECHA" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar el registro"

      - name: Marcar el resultado
        if: steps.publicacion.outcome == 'failure'
        run: |
          echo "La publicación falló. El detalle está en auto-ig/registro.log"
          exit 1
