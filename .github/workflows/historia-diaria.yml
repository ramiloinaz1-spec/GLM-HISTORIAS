name: Historia diaria de Instagram

# Publica una historia por dia habil.
#
# GitHub suele retrasar (y a veces saltear) las ejecuciones programadas cuando
# sus servidores estan cargados, asi que en lugar de un unico intento hay varios
# a lo largo de la mañana. Un control impide que se publique dos veces el mismo
# dia: apenas una publicacion sale bien, queda una marca en publicado/ y los
# intentos siguientes no hacen nada.
on:
  schedule:
    # Horarios de Argentina. Todos los intentos terminan antes de las 11,
    # asi que a mas tardar la historia queda publicada cerca de esa hora.
    - cron: "6 12 * * 1-5" # 9:06
    - cron: "44 12 * * 1-5" # 9:44, reintento
    - cron: "19 13 * * 1-5" # 10:19, reintento
    - cron: "51 13 * * 1-5" # 10:51, ultimo intento
  workflow_dispatch:
    inputs:
      simular:
        description: "Probar sin publicar (true para simular)"
        required: false
        default: "false"

permissions:
  contents: write

defaults:
  run:
    working-directory: auto-ig

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Ya se publicó hoy?
        id: control
        run: |
          FECHA=$(TZ=America/Argentina/Buenos_Aires date +%F)
          echo "FECHA=$FECHA" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "seguir=si" >> $GITHUB_OUTPUT
            echo "Ejecución manual: se continúa."
          elif [ -f "publicado/$FECHA.txt" ]; then
            echo "seguir=no" >> $GITHUB_OUTPUT
            echo "La historia del $FECHA ya se publicó. No se hace nada."
          else
            echo "seguir=si" >> $GITHUB_OUTPUT
            echo "Todavía no se publicó el $FECHA."
          fi

      - uses: actions/setup-python@v5
        if: steps.control.outputs.seguir == 'si'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.control.outputs.seguir == 'si'
        run: |
          pip install --quiet pillow playwright requests
          playwright install --with-deps chromium

      - name: Generar la historia del día
        if: steps.control.outputs.seguir == 'si'
        run: python3 generar.py

      - name: Guardar la imagen en el repositorio
        if: steps.control.outputs.seguir == 'si'
        run: |
          ARCHIVO=$(cat ultima.txt)
          echo "ARCHIVO=auto-ig/$ARCHIVO" >> $GITHUB_ENV
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f "$ARCHIVO" estado.json
          git commit -m "Historia del $(date +%F)" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar la imagen, se continúa igual"

      - name: Publicar la historia en Instagram
        id: publicacion
        if: steps.control.outputs.seguir == 'si'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_ACCES_TOKEN }}
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${ARCHIVO}"
          echo "Imagen: $URL"
          RUTA="${ARCHIVO#auto-ig/}"
          if [ "${{ github.event.inputs.simular }}" = "true" ]; then
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL" --simular
          else
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL"
          fi

      - name: Dejar constancia de la publicación
        if: steps.publicacion.outcome == 'success' && github.event.inputs.simular != 'true'
        run: |
          mkdir -p publicado
          echo "Publicada el $FECHA" > "publicado/$FECHA.txt"
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f "publicado/$FECHA.txt" registro.log
          git commit -m "Publicada la historia del $FECHA" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar la constancia"

      - name: Guardar el registro cuando algo falla
        if: failure() || steps.publicacion.outcome == 'failure'
        run: |
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f registro.log || true
          git commit -m "Registro del $FECHA" || echo "sin cambios"
          git pull --rebase -q origin main || true
          git push || echo "no se pudo guardar el registro"

      - name: Marcar el resultado
        if: steps.publicacion.outcome == 'failure'
        run: |
          echo "La publicación falló. El detalle está en auto-ig/registro.log"
          exit 1
