name: Historia diaria de Instagram

# Publica una historia de lunes a viernes a las 9:45 de Argentina (12:45 UTC).
# Tambien se puede ejecutar a mano desde la pestaña Actions, con "Run workflow".
on:
  schedule:
    - cron: "45 12 * * 1-5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Probar sin publicar (escribí true para simular)"
        required: false
        default: "false"

permissions:
  contents: write

defaults:
  run:
    working-directory: auto-ig

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet pillow playwright requests
          playwright install --with-deps chromium

      - name: Generar la historia del día
        run: python3 generar.py

      - name: Publicar la imagen en el repositorio
        run: |
          ARCHIVO=$(cat ultima.txt)
          echo "ARCHIVO=auto-ig/$ARCHIVO" >> $GITHUB_ENV
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f "$ARCHIVO" estado.json
          git commit -m "Historia del $(date +%F)" || echo "sin cambios"
          git push || echo "no se pudo guardar en el repositorio, se continua igual"

      - name: Publicar la historia en Instagram
        id: publicacion
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${ARCHIVO}"
          echo "Imagen: $URL"
          RUTA="${ARCHIVO#auto-ig/}"
          if [ "${{ github.event.inputs.simular }}" = "true" ]; then
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL" --simular
          else
            python3 publicar.py --imagen "$RUTA" --url-imagen "$URL"
          fi

      - name: Guardar el registro en el repositorio
        if: always()
        run: |
          git config user.name "historias-bot"
          git config user.email "actions@github.com"
          git add -f registro.log || true
          git commit -m "Registro de la ejecución $(date +%F\ %H:%M)" || echo "sin cambios"
          git pull --rebase -q || true
          git push || echo "no se pudo guardar el registro"

      - name: Marcar el resultado
        if: steps.publicacion.outcome == 'failure'
        run: |
          echo "La publicación falló. El detalle quedó en auto-ig/registro.log"
          exit 1

      - name: Guardar la historia como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: historia
          path: salida/
